<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telegram Mini App Store - Concept</title>
<style>
:root{--bg:#0e1621;--bg2:#17212b;--card:#1d2a38;--line:#101a24;--tx:#f5f7fa;--mu:#7d8b99;--bl:#2aabee;--bl2:#1c93d6;--gr:#4fd18b;--glass:rgba(32,46,62,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eef3;--bg2:#fff;--card:#f1f5f9;--line:#dfe6ec;--tx:#0f1a24;--mu:#6b7886;--glass:rgba(255,255,255,.6)}}
:root[data-theme="light"]{--bg:#e9eef3;--bg2:#fff;--card:#f1f5f9;--line:#dfe6ec;--tx:#0f1a24;--mu:#6b7886;--glass:rgba(255,255,255,.6)}
:root[data-theme="dark"]{--bg:#0e1621;--bg2:#17212b;--card:#1d2a38;--line:#101a24;--tx:#f5f7fa;--mu:#7d8b99;--glass:rgba(32,46,62,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.35 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg2);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg2);transition:transform .28s ease,opacity .28s ease}
.scr.off{transform:translateX(24px);opacity:0;pointer-events:none}
.scr.back{transform:translateX(-24px);opacity:0;pointer-events:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:24px}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px}
.top h1{font-size:21px;font-weight:600;flex:1}
.sb{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:22px;background:var(--bg);color:var(--mu);min-width:0}
.sb input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit}
.sb input::placeholder{color:var(--mu)}
.tabs{display:flex;gap:2px;margin:0 14px 8px;padding:4px;border-radius:22px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:8px 14px;border-radius:18px;color:var(--mu);white-space:nowrap}
.tabs .on{background:#243649;color:var(--bl)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none}
.row b{font-weight:500;display:block}
.row small{color:var(--mu)}
.chat .meta{flex:1;min-width:0}
.chat small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{padding:7px 18px;border-radius:16px;background:var(--bl);color:#fff;font-weight:500}
.open:active{background:var(--bl2)}
.cap{padding:8px 14px;color:var(--mu);display:flex;justify-content:space-between;background:var(--bg)}
/* Store button: the one memorable element */
.storebtn{position:relative;isolation:isolate;flex:none;width:56px;height:56px;border-radius:19px;background:linear-gradient(145deg,#3ad0ff 0%,#2a86ff 52%,#7a5cff 100%);color:#fff;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 12px rgba(20,40,160,.35),0 8px 20px -6px rgba(42,134,255,.8);transition:transform .15s}
.storebtn:active{transform:scale(.92)}
.storebtn::before{content:"";position:absolute;inset:-3px;border-radius:22px;z-index:-1;background:conic-gradient(from 0deg,#3ad0ff,#7a5cff,#ff6ad5,#ffb86a,#3ad0ff);filter:blur(7px);opacity:.8;animation:spin 5s linear infinite}
.storebtn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%) 150% 0/250% 100% no-repeat;animation:shine 3.2s ease-in-out infinite}
.storebtn span{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.storebtn i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff4d6d;font:700 10px/18px Roboto,system-ui,sans-serif;font-style:normal;box-shadow:0 0 0 2px var(--bg2)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%,35%{background-position:150% 0}75%,100%{background-position:-50% 0}}
@media(prefers-reduced-motion:reduce){.storebtn::before,.storebtn::after{animation:none}.scr{transition:none}}
/* glass bottom nav */
.nav{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:66px;padding:6px;border-radius:33px;display:flex;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:27px;font-size:12px;font-weight:500;color:var(--tx);position:relative}
.nav .on{background:rgba(42,171,238,.2);color:var(--bl)}
.nav .bd{position:absolute;top:3px;left:50%;margin-left:6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bl);color:#fff;font-size:11px;line-height:19px}
.nav .me{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6b7fa8,#1a2233)}
.fab{position:absolute;right:20px;bottom:98px;width:56px;height:56px;border-radius:50%;background:var(--bl);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(42,171,238,.8)}
.fab:active{transform:scale(.94)}
.hint{margin:8px 14px;padding:10px 12px;border-radius:12px;background:var(--card);color:var(--mu);font-size:13px}
/* store */
.ban{margin:4px 14px 12px;padding:14px;border-radius:16px;background:linear-gradient(120deg,#12456e,#1a6fa8);display:flex;gap:12px;align-items:center;color:#fff}
.ban p{font-size:13px;opacity:.85}
.ban b{font-size:16px}
.chips{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.chips button{padding:8px 14px;border-radius:10px;background:var(--card);white-space:nowrap}
.chips .on{background:var(--bl);color:#fff}
h2{font-size:17px;font-weight:600;padding:6px 14px}
.hs{display:flex;gap:10px;padding:0 14px 14px;overflow-x:auto;scrollbar-width:none}
.tile{flex:none;width:104px;text-align:center;padding:12px 6px;border-radius:14px;background:var(--card)}
.tile .ic{margin:0 auto 8px}
.tile b{display:flex;gap:4px;justify-content:center;align-items:center;font-size:13px;font-weight:500}
.tile small{color:var(--mu);font-size:12px}
.ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.app{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left}
.app:active{background:var(--card)}
.app .t{flex:1;min-width:0}
.app .n{display:flex;gap:6px;align-items:center;font-weight:500}
.app .d{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .r{color:var(--mu);font-size:12px}
.star{color:#f6b73c}
.empty{padding:40px 24px;text-align:center;color:var(--mu)}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 18px 24px;transform:translateY(100%);transition:transform .3s ease}
.sheet.on{transform:none}
.sh{display:flex;gap:14px;align-items:center}
.sh .ic{width:72px;height:72px;font-size:36px;border-radius:18px}
.sh h3{font-size:20px;font-weight:600;display:flex;gap:6px;align-items:center}
.stats{display:flex;margin:16px 0;border-radius:14px;background:var(--card)}
.stats div{flex:1;padding:10px;text-align:center}
.stats b{display:block;font-size:16px}
.stats small{color:var(--mu);font-size:12px}
.chk{list-style:none;padding:0;margin:8px 0 18px;display:grid;gap:10px}
.chk li{display:flex;gap:10px;font-size:14px}
.chk li span{color:var(--gr);flex:none}
.chk small{display:block;color:var(--mu)}
.big{width:100%;padding:13px;border-radius:12px;background:var(--bl);color:#fff;font-weight:600;font-size:16px}
.rep{display:block;margin:12px auto 0;color:var(--mu);font-size:13px}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);padding:10px 16px;border-radius:20px;background:#000c;color:#fff;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

<section class="scr" id="chats">
  <div class="top"><h1>Telegram</h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 6.8-1.2"/></svg><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></div>
  <button class="sb" id="fakeSearch" style="margin:0 14px 8px;flex:none;width:auto;text-align:left" aria-label="Search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search Chats</button>
  <div class="scroll" id="chatList"></div>
  <button class="fab" aria-label="New message"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="nav" aria-label="Main">
    <button class="on"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5C4 4.1 5.1 3 6.5 3h9C16.9 3 18 4.1 18 5.5v6c0 1.4-1.1 2.5-2.5 2.5H10l-3.4 3v-3H6.5C5.1 14 4 12.900 4 11.500z"/><path opacity=".7" d="M19.500 8H20c1.100 0 2 .9 2 2v6.500c0 1.100-.9 2-2 2h-.5V21l-3-2.500H11c-.8 0-1.500-.4-1.900-1h6.400c1.400 0 2.500-1.100 2.500-2.500z"/></svg>Chats<em class="bd" style="font-style:normal">40</em></button>
    <button data-t="Contacts (not part of this concept)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3"/><path d="M6.500 18c1.200-2.200 3-3.200 5.500-3.200s4.300 1 5.500 3.200"/></svg>Contacts</button>
    <button data-t="Settings (not part of this concept)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.500l1.600 1.800 2.400-.3.800 2.300 2.200 1-.5 2.400 1.400 2-1.800 1.700.1 2.400-2.300.9-1.200 2.100-2.400-.6-2.400.6-1.200-2.100-2.300-.9.1-2.400L3.700 13.400l1.400-2-.5-2.400 2.200-1 .8-2.300 2.400.3z"/><circle cx="12" cy="12" r="3"/></svg>Settings</button>
    <button data-t="Profile (not part of this concept)"><span class="me"></span>Profile</button>
  </nav>
</section>

<section class="scr off" id="search">
  <div class="top">
    <div class="sb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input placeholder="Search Chats" aria-label="Search chats"><button id="x" aria-label="Close search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <button class="storebtn" id="storeBtn" aria-label="Open Mini App Store"><i>New</i><span><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.6 4.5h12.8L20 9.5"/><path d="M5 12v7.5h14V12"/><path d="M4 9.5c0 1.7 1.3 2.8 2.7 2.8S9.4 11.2 9.4 9.5c0 1.7 1.2 2.8 2.6 2.8s2.6-1.1 2.6-2.8c0 1.7 1.3 2.8 2.7 2.8S20 11.2 20 9.5"/><path d="M10 19.5v-4h4v4"/></svg>Store</span></button>
  </div>
  <div class="tabs"><button class="on">Chats</button><button>Channels</button><button>Apps</button><button>Posts</button><button>Media</button></div>
  <div class="cap"><span>Recent</span><span>Clear All</span></div>
  <div class="scroll" id="recent"></div>
</section>

<section class="scr off" id="store">
  <div class="top">
    <button id="back" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>Mini App Store</h1>
    <button id="tg" aria-label="Toggle theme"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
  </div>
  <div class="sb" style="margin:0 14px 12px;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Search verified apps" aria-label="Search verified apps"></div>
  <div class="scroll">
    <div class="ban"><span id="bigShield"></span><div><b>Verified by Telegram</b><p>Every app here passed Telegram's security and privacy review.</p></div></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </div>
</section>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="App details"></div>
<div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const shield=(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-label="Verified by Telegram" role="img"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z" fill="#2aabee"/><path d="m8 12 3 3 5-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
$('#bigShield').innerHTML=shield(40);
const CATS=['All','Games','Finance','Tools','Social','Education','Entertainment'];
const APPS=[
{n:'Star Runner',d:'Endless runner with weekly leaderboards',c:'Games',i:'🚀',g:'#7b4dff,#d84dff',r:4.8,u:'2.3M',nw:1,rv:'Oct 2026'},
{n:'Pixel Chess',d:'Play chess with friends in any chat',c:'Games',i:'♟️',g:'#2b2f3a,#566074',r:4.7,u:'1.1M',rv:'Sep 2026'},
{n:'Merge Kingdom',d:'Merge, build and defend your castle',c:'Games',i:'🏰',g:'#e0802c,#f5c04a',r:4.6,u:'860K',nw:1,rv:'Oct 2026'},
{n:'Budget Buddy',d:'Track spending, split bills in groups',c:'Finance',i:'💰',g:'#1f9d6b,#4fd18b',r:4.9,u:'640K',rv:'Sep 2026'},
{n:'Tip Jar',d:'Support creators with Telegram Stars',c:'Finance',i:'⭐',g:'#e0a52c,#f6d36a',r:4.5,u:'310K',nw:1,rv:'Oct 2026'},
{n:'QR Studio',d:'Scan and create QR codes in seconds',c:'Tools',i:'▦',g:'#5b4de0,#8f86ff',r:4.8,u:'1.8M',rv:'Aug 2026'},
{n:'Voice to Text',d:'Turn voice messages into clean text',c:'Tools',i:'🎙️',g:'#d1405a,#ff7a8f',r:4.7,u:'920K',rv:'Sep 2026'},
{n:'Study Pal',d:'Flashcards you can share with classmates',c:'Education',i:'📚',g:'#1c7fc4,#4cc0f7',r:4.8,u:'540K',nw:1,rv:'Oct 2026'},
{n:'Language Duel',d:'Challenge a friend, learn 20 languages',c:'Education',i:'🗣️',g:'#2fa36b,#8ae0a6',r:4.6,u:'470K',rv:'Aug 2026'},
{n:'Meetup Map',d:'Find friends and events nearby',c:'Social',i:'📍',g:'#e05a2c,#ff9a5a',r:4.4,u:'290K',rv:'Sep 2026'},
{n:'Watch Together',d:'Synced video nights with your group',c:'Entertainment',i:'🎬',g:'#3a3f8f,#7a82e8',r:4.7,u:'1.4M',nw:1,rv:'Oct 2026'},
{n:'Trivia Night',d:'Live quiz shows with prizes',c:'Entertainment',i:'🎯',g:'#a02ce0,#e07aff',r:4.5,u:'780K',rv:'Aug 2026'}];
const ic=(a,cl='')=>`<div class="ic ${cl}" style="background:linear-gradient(135deg,${a.g})">${a.i}</div>`;

// chats
const CH=[['#2b6fa8','👥','Design Crew','Mia: the new icons are ready','13:58'],['#a8452b','📣','Dev News','Bot API update is live','13:41'],['#2b8f6f','👤','Sara','See you at 6!','12:10'],['#6b4aa8','🤖','BotFather','Choose a bot to change','Fri'],['#a8892b','📈','Market Talk','New post: weekly recap','Fri'],['#2b8fa8','🎮','Game Night','Alex: who is in?','Thu'],['#a82b6f','📷','Photo Club','3 new photos','Wed']];
$('#chatList').innerHTML=CH.map(c=>`<div class="row chat"><div class="av" style="background:${c[0]}">${c[1]}</div><div class="meta"><b>${c[2]}</b><small>${c[3]}</small></div><small>${c[4]}</small></div>`).join('')+'<div style="height:100px"></div>';
$('#recent').innerHTML=[['BotFather','7.5M users','👤'],[APPS[0].n,'mini app',APPS[0].i],[APPS[5].n,'mini app',APPS[5].i]].map((r,k)=>`<div class="row"><div class="av" style="background:var(--card)">${r[2]}</div><div style="flex:1"><b>${r[0]} ${k!=1?'':''}</b><small>${r[1]}</small></div><button class="open" data-t="Opening ${r[0]}…">Open</button></div>`).join('')+'<div class="hint">New: the Store button opens only apps verified by Telegram.</div>';

// nav
let cur='chats';
function go(id){const order=['chats','search','store'];document.querySelectorAll('.scr').forEach(s=>{const k=s.id;s.classList.toggle('off',order.indexOf(k)>order.indexOf(id));s.classList.toggle('back',order.indexOf(k)<order.indexOf(id))});cur=id}
go('chats');
$('#fakeSearch').onclick=()=>{go('search');$('#search input').focus({preventScroll:true})};
$('#x').onclick=()=>go('chats');
$('#storeBtn').onclick=()=>{go('store');render()};
$('#back').onclick=()=>go('search');
$('#tg').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1621';r.dataset.theme=d?'light':'dark'};

// store
let cat='All',q='';
function row(a){return `<button class="app" data-i="${APPS.indexOf(a)}">${ic(a)}<div class="t"><div class="n">${a.n}${shield(15)}</div><div class="d">${a.d}</div><div class="r"><span class="star">★</span> ${a.r} · ${a.u} users</div></div><span class="open" data-open>Open</span></button>`}
function render(){
 $('#chips').innerHTML=CATS.map(c=>`<button class="${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 let L=APPS.filter(a=>(cat=='All'||a.c==cat)&&(a.n+a.d).toLowerCase().includes(q));
 let h='';
 if(cat=='All'&&!q){
  h+='<h2>New</h2><div class="hs">'+APPS.filter(a=>a.nw).map(a=>`<button class="tile" data-i="${APPS.indexOf(a)}">${ic(a)}<b>${a.n}</b><small>${a.c}</small></button>`).join('')+'</div><h2>Top this week</h2>'+[...APPS].sort((a,b)=>b.r-a.r).slice(0,6).map(row).join('');
 }else h+=(L.length?`<h2>${q?'Results':cat}</h2>`+L.map(row).join(''):'<div class="empty"><b>No verified apps found</b><br>Try another word or category.</div>');
 $('#list').innerHTML=h}
$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;render()}};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const a=APPS[b.dataset.i];if(e.target.closest('[data-open]'))return toast('Opening '+a.n+'…');sheet(a)};
document.addEventListener('click',e=>{const o=e.target.closest('[data-t]');if(o)toast(o.dataset.t)});

function sheet(a){
 $('#sheet').innerHTML=`<div class="sh">${ic(a)}<div><h3>${a.n}${shield(20)}</h3><small style="color:var(--mu)">${a.c} mini app</small></div></div>
 <div class="stats"><div><b>${a.r} ★</b><small>rating</small></div><div><b>${a.u}</b><small>monthly users</small></div><div><b>${a.rv}</b><small>last review</small></div></div>
 <p style="margin-bottom:12px">${a.d}.</p>
 <b>Telegram review</b>
